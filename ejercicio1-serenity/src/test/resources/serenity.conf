# =============================================================================
# serenity.conf: aquí se le dice a Serenity con qué navegador correr y cómo.
# Es como decirle al ñaño "usa Chrome, y si quieres rapidito, sin pantalla".
# =============================================================================

# Le decimos que el navegador por defecto es Chrome
webdriver {
  driver = chrome
}

# Configuración del navegador Chrome
headless.mode = true   # true = corre sin abrir ventana (más rápido, ideal pa' servidores/CI)

chrome {
  # Argumentos que le pasamos a Chrome pa' que se porte bien en cualquier máquina
  arguments = [
    "--headless=new",          # modo sin ventana
    "--no-sandbox",            # evita problemas de permisos en servidores
    "--disable-dev-shm-usage", # evita que se quede sin memoria compartida
    "--window-size=1920,1080", # tamaño de ventana virtual
    "--disable-gpu"            # apaga la GPU, no la necesitamos pa' tests
  ]
}

# Nombre que sale en el reporte, pa' que se vea profesional
serenity {
  project.name = "SauceDemo E2E - Prueba Funcional Automatizada"
  take.screenshots = FOR_EACH_ACTION   # toma captura en cada acción, full evidencia
}
